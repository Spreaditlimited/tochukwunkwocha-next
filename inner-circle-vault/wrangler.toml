name = "inner-circle-vault"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "vault.tochukwunkwocha.com", custom_domain = true }]

[vars]
VAULT_MANAGED_ACCESS = "true"

[assets]
directory = "./public"

# The binding reads the private catalog managed by /internal/vault.
[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "inner-circle-vault"

# File downloads use the S3 API directly.
# Set all credentials with wrangler secret put; never put them here.
